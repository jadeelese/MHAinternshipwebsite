name: Weekly link re-check
on:
  schedule:
    # Mondays at 15:00 UTC (~ 8am Pacific)
    - cron: "0 15 * * 1"
  workflow_dispatch: {}

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run link check (allow failure, capture report)
        id: linkcheck
        env:
          CHECK_LINKS: "1"
        run: |
          set +e
          node scripts/validate-listings.mjs listings.json > linkcheck.log 2>&1
          CODE=$?
          echo "exit_code=$CODE" >> $GITHUB_OUTPUT
          cat linkcheck.log
          exit 0
      - name: File issue if anything broke
        if: steps.linkcheck.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('linkcheck.log', 'utf8');
            const title = `Weekly link check: broken sources detected (${new Date().toISOString().slice(0,10)})`;
            const body = [
              "The weekly link check found broken \`source_url\` entries.",
              "",
              "\`\`\`",
              log.slice(0, 60000),
              "\`\`\`",
              "",
              "Suggested action: for each listing above, update \`source_url\` or set \`link_status\` to \`pending\` until re-verified.",
              "",
              "— automated"
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["broken-link", "automated"]
            });
